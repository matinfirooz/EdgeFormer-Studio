<text id="label-38" x="1276.0" y="625" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Concat · D → D</text>
<text id="label-39" x="1347" y="570" font-size="16" fill="#AD6515" font-weight="700" text-anchor="middle">q</text>
