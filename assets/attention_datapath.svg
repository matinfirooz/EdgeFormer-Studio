<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title description">
<title id="title">Vision Transformer datapath</title><desc id="description">Images become patch tokens and pass through a stack of pre-norm encoder blocks. One block is expanded into LayerNorm, QKV, QK transpose, softmax, AV, projection, residual additions and an MLP. Amber q badges identify Conv and Linear operators eligible for simulated quantization.</desc>
