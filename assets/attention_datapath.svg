<g id="labels">
<text id="label-0" x="96" y="44" font-size="14" fill="#087F86" font-weight="700" letter-spacing="2.0">EDGEFORMER STUDIO</text>
<text id="label-1" x="1544" y="44" font-size="13" fill="#5E6F85" font-weight="400" text-anchor="end" letter-spacing="1.7">FIGURE 02</text>
<text id="label-2" x="56" y="100" font-size="38" fill="#182B46" font-weight="700">Vision Transformer datapath</text>
<text id="label-3" x="56" y="137" font-size="19" fill="#5E6F85" font-weight="400">Connected model flow with an expanded pre-norm block and explicit attention operands.</text>
<text id="label-4" x="92" y="208" font-size="16" fill="white" font-weight="700" text-anchor="middle">A</text>
<text id="label-5" x="119" y="209" font-size="21" fill="#182B46" font-weight="700">Model pipeline</text>
<text id="label-6" x="165.0" y="272" font-size="21" fill="#5E6F85" font-weight="700" text-anchor="middle">Image</text>
<text id="label-7" x="165.0" y="300" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">B × C × H × W</text>
<text id="label-8" x="404.0" y="272" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">Patch projection</text>
<text id="label-9" x="404.0" y="300" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Conv2d · stride P</text>
<text id="label-10" x="497" y="245" font-size="16" fill="#AD6515" font-weight="700" text-anchor="middle">q</text>
<text id="label-11" x="688.0" y="272" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">Token assembly</text>
<text id="label-12" x="688.0" y="300" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">CLS + position</text>
<text id="label-13" x="977.0" y="272" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Encoder stack</text>
<text id="label-14" x="977.0" y="300" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">L pre-norm blocks</text>
<text id="label-15" x="1328.0" y="272" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">Readout</text>
<text id="label-16" x="1328.0" y="300" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">LayerNorm → CLS → Linear</text>
<text id="label-17" x="1503" y="246" font-size="16" fill="#AD6515" font-weight="700" text-anchor="middle">q</text>
<text id="label-18" x="92" y="432" font-size="16" fill="white" font-weight="700" text-anchor="middle">B</text>
<text id="label-19" x="119" y="433" font-size="21" fill="#182B46" font-weight="700">Inside one encoder block</text>
<text id="label-20" x="1518" y="433" font-size="16" fill="#5E6F85" font-weight="400" text-anchor="end">D = h · d   |   M = MLP hidden width</text>
<text id="label-21" x="604" y="545" font-size="14" fill="#087F86" font-weight="700" letter-spacing="1.0">ATTENTION / PER HEAD</text>
<text id="label-22" x="88" y="592" font-size="22" fill="#182B46" font-weight="700">X<tspan baseline-shift="sub" font-size="70%">ℓ</tspan></text>
<text id="label-23" x="230.0" y="597" font-size="21" fill="#5E6F85" font-weight="700" text-anchor="middle">LN₁</text>
<text id="label-24" x="230.0" y="625" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">D → D</text>
<text id="label-25" x="430.0" y="597" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">QKV Linear</text>
<text id="label-26" x="430.0" y="625" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">D → 3D</text>
<text id="label-27" x="503" y="570" font-size="16" fill="#AD6515" font-weight="700" text-anchor="middle">q</text>
<text id="label-28" x="558" y="574" font-size="17" fill="#087F86" font-weight="700" text-anchor="middle">Q</text>
<text id="label-29" x="558" y="601" font-size="17" fill="#087F86" font-weight="700" text-anchor="middle">K</text>
<text id="label-30" x="552" y="662" font-size="17" fill="#087F86" font-weight="700" text-anchor="end">V</text>
<text id="label-31" x="816" y="706" font-size="16" fill="#087F86" font-weight="400" text-anchor="middle">Q, K, V: B × h × N × d</text>
<text id="label-32" x="680.0" y="611" font-size="20" fill="#087F86" font-weight="700" text-anchor="middle">QKᵀ / √d</text>
<text id="label-33" x="870.0" y="611" font-size="20" fill="#5E6F85" font-weight="700" text-anchor="middle">Softmax</text>
<text id="label-34" x="1060.0" y="611" font-size="23" fill="#087F86" font-weight="700" text-anchor="middle">AV</text>
