<text id="label-49" x="1038.0" y="887" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">M → D</text>
<text id="label-50" x="1111" y="832" font-size="16" fill="#AD6515" font-weight="700" text-anchor="middle">q</text>
<path d="M1412,866 L1428,866" fill="none" stroke="#182B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1420,858 L1420,874" fill="none" stroke="#182B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text id="label-51" x="810" y="950" font-size="17" fill="#5E6F85" font-weight="400" text-anchor="middle">Residual Y<tspan baseline-shift="sub" font-size="70%">ℓ</tspan></text>
<text id="label-52" x="1505" y="923" font-size="22" fill="#182B46" font-weight="700" text-anchor="end">X<tspan baseline-shift="sub" font-size="70%">ℓ+1</tspan></text>
<text id="label-53" x="734" y="808" font-size="14" fill="#315DA8" font-weight="700" text-anchor="middle" letter-spacing="1.0">FEED-FORWARD MLP</text>
<text id="label-54" x="71" y="1065" font-size="16" fill="#AD6515" font-weight="700" text-anchor="middle">q</text>
<text id="label-55" x="94" y="1067" font-size="17" fill="#AD6515" font-weight="400">Conv / Linear: PTQ weights; QAT inputs + weights</text>
<text id="label-56" x="903" y="1067" font-size="17" fill="#5E6F85" font-weight="400">Residual path</text>
<text id="label-57" x="56" y="1108" font-size="16" fill="#5E6F85" font-weight="400">Logical software datapath. Softmax, attention products, normalization, GELU and residual adds remain floating.</text>
