<rect x="38" y="413" width="1364" height="294" rx="12" fill="white" stroke="#dbe3ef" stroke-width="1.5"/>
<text x="60" y="444" font-size="17" fill="#17243b" font-weight="700">02  COMPARE MATCHED DESIGN POINTS</text>
<text x="1380" y="444" font-size="12" fill="#53647b" font-weight="400" text-anchor="end">Same reference weights, evaluation batches and input shapes</text>
<rect x="65" y="491" width="240" height="130" rx="8" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="185.0" y="520" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">Reference model</text>
<text x="185.0" y="546" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Floating checkpoint</text>
<text x="185.0" y="568" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">or seeded untrained model</text>
<text x="185.0" y="590" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">No hidden random fallback</text>
<rect x="381" y="491" width="280" height="130" rx="8" fill="#fff7e9" stroke="#b45309" stroke-width="1.5"/>
<text x="521.0" y="520" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">Precision / error variants</text>
<text x="521.0" y="546" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">W32 / W8 / W4 · mixed plan</text>
<text x="521.0" y="568" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Per-channel weight PTQ</text>
<text x="521.0" y="590" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Optional statistical noise</text>
<rect x="737" y="491" width="285" height="130" rx="8" fill="#ecf8f5" stroke="#0f766e" stroke-width="1.5"/>
<text x="879.5" y="520" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">Matched evaluation</text>
<text x="879.5" y="546" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Top-1 · loss · agreement</text>
<text x="879.5" y="568" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Logit RMSE · attention JS</text>
<text x="879.5" y="590" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Layer sensitivity</text>
<rect x="1098" y="491" width="270" height="130" rx="8" fill="#ecf8f5" stroke="#0f766e" stroke-width="1.5"/>
<text x="1233.0" y="520" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">Design table</text>
<text x="1233.0" y="546" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">CSV + JSON + Pareto plot</text>
<text x="1233.0" y="568" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Accuracy / packed storage</text>
<text x="1233.0" y="590" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Runtime measured separately</text>
<path d="M305 551 H381" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path d="M661 551 H737" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path d="M1022 551 H1098" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path d="M1193 335 V398 H51 V464 H185 V491" fill="none" stroke="#53647b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-gray)" stroke-dasharray="6 5"/>
<text x="65" y="665" font-size="14" fill="#53647b" font-weight="400">PTQ: weights only  |  QAT: Linear/Conv input + weight Q/DQ with straight-through gradients</text>
<rect x="38" y="735" width="1364" height="224" rx="12" fill="white" stroke="#dbe3ef" stroke-width="1.5"/>
<text x="60" y="766" font-size="17" fill="#17243b" font-weight="700">03  INTERPRET EACH KIND OF EVIDENCE</text>
<text x="1380" y="766" font-size="12" fill="#53647b" font-weight="400" text-anchor="end">Measured execution, numerical simulation and analytical cost stay distinguishable</text>
<rect x="65" y="805" width="393" height="112" rx="8" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="261.5" y="834" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">Measured</text>
<text x="261.5" y="860" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Forward latency · median / p95</text>
<text x="261.5" y="882" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Device, thread count, batch size</text>
<rect x="490" y="805" width="408" height="112" rx="8" fill="#fff7e9" stroke="#b45309" stroke-width="1.5"/>
<text x="694.0" y="834" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">Simulated numerics</text>
<text x="694.0" y="860" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Quantization grid · output noise</text>
<text x="694.0" y="882" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Accuracy changes on selected data</text>
<rect x="930" y="805" width="438" height="112" rx="8" fill="#ecf8f5" stroke="#0f766e" stroke-width="1.5"/>
<text x="1149.0" y="834" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">Analytical hardware cost</text>
<text x="1149.0" y="860" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">MACs · ideal packed bytes + scales</text>
<text x="1149.0" y="882" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Uncalibrated compute-energy proxy</text>
<text x="48" y="1000" font-size="14" fill="#53647b" font-weight="400">No integer runtime kernels, circuit PPA or trained-dataset accuracy is implied by a precision label.</text>
</svg>