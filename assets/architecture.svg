<g id="labels">
<text id="label-0" x="96" y="44" font-size="14" fill="#087F86" font-weight="700" letter-spacing="2.0">EDGEFORMER STUDIO</text>
<text id="label-1" x="1544" y="44" font-size="13" fill="#5E6F85" font-weight="400" text-anchor="end" letter-spacing="1.7">FIGURE 01</text>
<text id="label-2" x="56" y="100" font-size="38" fill="#182B46" font-weight="700">Experiment architecture</text>
<text id="label-3" x="56" y="137" font-size="19" fill="#5E6F85" font-weight="400">A shared starting point, controlled numerical variants, and comparable reports.</text>
<text id="label-4" x="92" y="208" font-size="16" fill="white" font-weight="700" text-anchor="middle">A</text>
<text id="label-5" x="119" y="209" font-size="21" fill="#182B46" font-weight="700">Train reference</text>
<text id="label-6" x="510" y="208" font-size="16" fill="white" font-weight="700" text-anchor="middle">B</text>
<text id="label-7" x="537" y="209" font-size="21" fill="#182B46" font-weight="700">Build candidates</text>
<text id="label-8" x="1048" y="208" font-size="16" fill="white" font-weight="700" text-anchor="middle">C</text>
<text id="label-9" x="1075" y="209" font-size="21" fill="#182B46" font-weight="700">Evaluate &amp; report</text>
<text id="label-10" x="236.0" y="281" font-size="21" fill="#5E6F85" font-weight="700" text-anchor="middle">Dataset loaders</text>
<text id="label-11" x="236.0" y="309" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">CIFAR · Tiny ImageNet</text>
<text id="label-12" x="236.0" y="403" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">TinyViT</text>
<text id="label-13" x="236.0" y="431" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Patch → attention → MLP</text>
<text id="label-14" x="236.0" y="525" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">Optimize &amp; validate</text>
<text id="label-15" x="236.0" y="553" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">AdamW · cosine schedule</text>
<text id="label-16" x="236.0" y="653" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Reference checkpoint</text>
<text id="label-17" x="236.0" y="681" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">FP32 weights + configuration</text>
<text id="label-18" x="236.0" y="706" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Best / latest · epoch resume</text>
<text id="label-19" x="714.0" y="281" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">FP32 reference</text>
<text id="label-20" x="714.0" y="309" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Unmodified numerical baseline</text>
<text id="label-21" x="714.0" y="417" font-size="21" fill="#AD6515" font-weight="700" text-anchor="middle">Weight-only PTQ</text>
<text id="label-22" x="714.0" y="445" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Per-output-channel weight scales</text>
<text id="label-23" x="614.0" y="485" font-size="15" fill="#AD6515" font-weight="700" text-anchor="middle">W8</text>
<text id="label-24" x="685.0" y="485" font-size="15" fill="#AD6515" font-weight="700" text-anchor="middle">W4</text>
<text id="label-25" x="785.0" y="485" font-size="15" fill="#AD6515" font-weight="700" text-anchor="middle">Mixed plan</text>
<text id="label-26" x="714.0" y="581" font-size="21" fill="#315DA8" font-weight="700" text-anchor="middle">QAT fine-tuning</text>
<text id="label-27" x="714.0" y="609" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Dynamic input + weight Q/DQ</text>
<text id="label-28" x="714.0" y="634" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Additional optimization budget</text>
<text id="label-29" x="714" y="731" font-size="16" fill="#AD6515" font-weight="400" text-anchor="middle">Optional output noise: FP32 / PTQ</text>
<text id="label-30" x="1278.0" y="281" font-size="21" fill="#5E6F85" font-weight="700" text-anchor="middle">Fixed evaluation batches</text>
<text id="label-31" x="1278.0" y="309" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Matched samples · preprocessing · shapes</text>
<text id="label-32" x="1278.0" y="417" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Matched evaluation</text>
<text id="label-33" x="1278.0" y="445" font-size="18" fill="#182B46" font-weight="400" text-anchor="middle">Top-1 · loss · prediction agreement</text>
<text id="label-34" x="1278.0" y="470" font-size="18" fill="#182B46" font-weight="400" text-anchor="middle">Logit RMSE · attention divergence</text>
<text id="label-35" x="1278.0" y="609" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Study outputs</text>
<text id="label-36" x="1278.0" y="637" font-size="18" fill="#182B46" font-weight="400" text-anchor="middle">CSV / JSON · layer sensitivity</text>
<text id="label-37" x="1278.0" y="662" font-size="18" fill="#182B46" font-weight="400" text-anchor="middle">Accuracy–storage Pareto set</text>
<text id="label-38" x="1278" y="742" font-size="16" fill="#5E6F85" font-weight="400" text-anchor="middle">Runtime is recorded on the execution host.</text>
<text id="label-39" x="56" y="827" font-size="14" fill="#5E6F85" font-weight="700" letter-spacing="1.6">REPORT FIELDS</text>
<text id="label-40" x="80" y="885" font-size="21" fill="#315DA8" font-weight="700">Measured execution</text>
<text id="label-41" x="80" y="919" font-size="17" fill="#182B46" font-weight="400">Forward latency · median / p95</text>
<text id="label-42" x="584" y="885" font-size="21" fill="#087F86" font-weight="700">Numerical behavior</text>
<text id="label-43" x="584" y="919" font-size="17" fill="#182B46" font-weight="400">Accuracy · agreement · distortion</text>
<text id="label-44" x="1088" y="885" font-size="21" fill="#AD6515" font-weight="700">Analytical hardware cost</text>
<text id="label-45" x="1088" y="919" font-size="17" fill="#182B46" font-weight="400">MACs · packed bytes · energy proxy</text>
<text id="label-46" x="56" y="998" font-size="16" fill="#5E6F85" font-weight="400">Q/DQ uses floating kernels. Packed storage and energy are analytical estimates; energy is uncalibrated.</text>
