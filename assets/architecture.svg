<rect width="1440" height="1040" fill="#f7f9fd"/>
<text x="48" y="51" font-size="13" fill="#0f766e" font-weight="700" letter-spacing="2">EDGEFORMER STUDIO</text>
<text x="48" y="94" font-size="31" fill="#17243b" font-weight="700">From a floating model to a reproducible design study</text>
<text x="48" y="127" font-size="16" fill="#53647b" font-weight="400">Executable workflows for compact Vision Transformers · version 0.2</text>
<rect x="38" y="159" width="1364" height="225" rx="12" fill="white" stroke="#dbe3ef" stroke-width="1.5"/>
<text x="60" y="190" font-size="17" fill="#17243b" font-weight="700">01  TRAIN AND VALIDATE</text>
<text x="1380" y="190" font-size="12" fill="#53647b" font-weight="400" text-anchor="end">Checkpoints preserve configuration, optimizer, schedule and RNG</text>
<rect x="65" y="225" width="225" height="110" rx="8" fill="#ecf8f5" stroke="#0f766e" stroke-width="1.5"/>
<text x="177.5" y="254" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">Data loaders</text>
<text x="177.5" y="280" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">CIFAR / Tiny ImageNet</text>
<text x="177.5" y="302" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Seeded offline smoke data</text>
<rect x="351" y="225" width="245" height="110" rx="8" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/>
