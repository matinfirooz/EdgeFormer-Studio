<text x="473.5" y="280" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">FP32 baseline or QAT</text>
<text x="473.5" y="302" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Patch → attention → MLP</text>
<rect x="657" y="225" width="300" height="110" rx="8" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="807.0" y="254" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">Training engine</text>
<text x="807.0" y="280" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">AdamW · cosine schedule</text>
<text x="807.0" y="302" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Validation every epoch</text>
<rect x="1018" y="225" width="350" height="110" rx="8" fill="#ecf8f5" stroke="#0f766e" stroke-width="1.5"/>
<text x="1193.0" y="254" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">Best / latest checkpoints</text>
<text x="1193.0" y="280" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Atomic state-dict saves</text>
<text x="1193.0" y="302" font-size="13" fill="#17243b" font-weight="400" text-anchor="middle">Safe loading · epoch resume</text>
