<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
<title id="title">Precision simulation</title><desc id="description">Per-output-channel weight scaling, division, rounding and clipping, and dequantization define the shared primitive. Weight-only PTQ stores dequantized floating weights. QAT applies separate input and weight fake quantizers and uses a straight-through gradient to floating master weights.</desc>
