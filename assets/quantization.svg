<g id="labels">
<text id="label-0" x="96" y="44" font-size="14" fill="#087F86" font-weight="700" letter-spacing="2.0">EDGEFORMER STUDIO</text>
<text id="label-1" x="1544" y="44" font-size="13" fill="#5E6F85" font-weight="400" text-anchor="end" letter-spacing="1.7">FIGURE 03</text>
<text id="label-2" x="56" y="100" font-size="38" fill="#182B46" font-weight="700">Precision simulation</text>
<text id="label-3" x="56" y="137" font-size="19" fill="#5E6F85" font-weight="400">A shared Q/DQ primitive; different inference and training paths.</text>
<text id="label-4" x="92" y="208" font-size="16" fill="white" font-weight="700" text-anchor="middle">A</text>
<text id="label-5" x="119" y="209" font-size="21" fill="#182B46" font-weight="700">Weight quantize–dequantize (Q/DQ)</text>
<text id="label-6" x="535.0" y="266" font-size="20" fill="#AD6515" font-weight="700" text-anchor="middle">Per-output-channel scale</text>
<text id="label-7" x="535.0" y="294" font-size="19" fill="#182B46" font-weight="400" text-anchor="middle">s<tspan baseline-shift="sub" font-size="70%">c</tspan> = max<tspan baseline-shift="sub" font-size="70%">i</tspan> |W<tspan baseline-shift="sub" font-size="70%">c,i</tspan>| / q<tspan baseline-shift="sub" font-size="70%">max</tspan></text>
<text id="label-8" x="1220" y="268" font-size="23" fill="#AD6515" font-weight="400">q<tspan baseline-shift="sub" font-size="70%">max</tspan> = 2ᵇ⁻¹ − 1</text>
<text id="label-9" x="1220" y="304" font-size="17" fill="#5E6F85" font-weight="400">W4: −7…7     W8: −127…127</text>
<text id="label-10" x="170.0" y="390" font-size="20" fill="#315DA8" font-weight="700" text-anchor="middle">Weight W</text>
<text id="label-11" x="170.0" y="418" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Floating tensor</text>
<text id="label-12" x="435.0" y="390" font-size="21" fill="#AD6515" font-weight="700" text-anchor="middle">Divide</text>
<text id="label-13" x="435.0" y="418" font-size="20" fill="#182B46" font-weight="400" text-anchor="middle">W / s<tspan baseline-shift="sub" font-size="70%">c</tspan></text>
<text id="label-14" x="770.0" y="390" font-size="21" fill="#AD6515" font-weight="700" text-anchor="middle">Round &amp; clip</text>
<text id="label-15" x="770.0" y="418" font-size="18" fill="#182B46" font-weight="400" text-anchor="middle">q = clip(round(W / s<tspan baseline-shift="sub" font-size="70%">c</tspan>))</text>
<text id="label-16" x="1105.0" y="390" font-size="21" fill="#AD6515" font-weight="700" text-anchor="middle">Rescale</text>
<text id="label-17" x="1105.0" y="418" font-size="20" fill="#182B46" font-weight="400" text-anchor="middle">W̃ = q · s<tspan baseline-shift="sub" font-size="70%">c</tspan></text>
<text id="label-18" x="1400.0" y="390" font-size="20" fill="#087F86" font-weight="700" text-anchor="middle">Weight W̃</text>
<text id="label-19" x="1400.0" y="418" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Floating Q/DQ values</text>
<text id="label-20" x="56" y="525" font-size="16" fill="#5E6F85" font-weight="400">Q/DQ returns floating values. Bias and normalization parameters remain floating.</text>
<text id="label-21" x="92" y="598" font-size="16" fill="white" font-weight="700" text-anchor="middle">B</text>
<text id="label-22" x="119" y="599" font-size="21" fill="#182B46" font-weight="700">Weight-only PTQ</text>
<text id="label-23" x="181.0" y="682" font-size="20" fill="#315DA8" font-weight="700" text-anchor="middle">Trained W</text>
<text id="label-24" x="181.0" y="710" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Floating weights</text>
<text id="label-25" x="442.0" y="682" font-size="21" fill="#AD6515" font-weight="700" text-anchor="middle">Q/DQ</text>
<text id="label-26" x="442.0" y="710" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Store floating W̃</text>
<text id="label-27" x="340.0" y="860" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Conv / Linear</text>
<text id="label-28" x="340.0" y="888" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Floating execution</text>
<text id="label-29" x="355" y="774" font-size="20" fill="#AD6515" font-weight="400">W̃</text>
<text id="label-30" x="82" y="855" font-size="18" fill="#315DA8" font-weight="400">Input x</text>
<text id="label-31" x="511" y="858" font-size="20" fill="#182B46" font-weight="400" text-anchor="middle">y</text>
<text id="label-32" x="82" y="981" font-size="16" fill="#5E6F85" font-weight="400">No parameter updates after quantization.</text>
<text id="label-33" x="656" y="598" font-size="16" fill="white" font-weight="700" text-anchor="middle">C</text>
<text id="label-34" x="683" y="599" font-size="21" fill="#182B46" font-weight="700">Quantization-aware training</text>
<text id="label-35" x="769.0" y="696" font-size="20" fill="#315DA8" font-weight="700" text-anchor="middle">Master W</text>
<text id="label-36" x="769.0" y="724" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Floating weights</text>
<text id="label-37" x="1009.0" y="696" font-size="19" fill="#AD6515" font-weight="700" text-anchor="middle">Weight Q/DQ</text>
<text id="label-38" x="1009.0" y="724" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Per channel</text>
<text id="label-39" x="769.0" y="834" font-size="20" fill="#315DA8" font-weight="700" text-anchor="middle">Input x</text>
<text id="label-40" x="769.0" y="862" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Floating tensor</text>
<text id="label-41" x="1009.0" y="834" font-size="19" fill="#AD6515" font-weight="700" text-anchor="middle">Input Q/DQ</text>
<text id="label-42" x="1009.0" y="862" font-size="16" fill="#182B46" font-weight="400" text-anchor="middle">Dynamic per tensor</text>
<text id="label-43" x="1351.0" y="801" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Conv / Linear</text>
<text id="label-44" x="1351.0" y="829" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Floating operator</text>
<text id="label-45" x="1351.0" y="854" font-size="17" fill="#182B46" font-weight="400" text-anchor="middle">Bias stays floating</text>
<text id="label-46" x="1368" y="743" font-size="20" fill="#AD6515" font-weight="400">W̃</text>
<text id="label-47" x="1163" y="831" font-size="20" fill="#AD6515" font-weight="400" text-anchor="middle">x̃</text>
<text id="label-48" x="1351.0" y="978" font-size="21" fill="#087F86" font-weight="700" text-anchor="middle">Task loss</text>
<text id="label-49" x="1368" y="917" font-size="20" fill="#182B46" font-weight="400">y</text>
<text id="label-50" x="914" y="955" font-size="19" fill="#087F86" font-weight="400" text-anchor="middle">STE: ∂QDQ / ∂z ≈ 1</text>
<text id="label-51" x="914" y="1006" font-size="15" fill="#5E6F85" font-weight="400" text-anchor="middle">AdamW updates floating master weights</text>
<text id="label-52" x="56" y="1072" font-size="16" fill="#5E6F85" font-weight="400">Solid arrows: forward values. Dashed amber: scales. Dashed teal: surrogate gradient. Both paths simulate low-bit numerics.</text>
</g>
</svg>
