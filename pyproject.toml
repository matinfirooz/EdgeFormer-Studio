[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeformer-studio"
version = "0.2.0"
description = "Reproducible quantization, sensitivity and hardware-cost experiments for compact ViTs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matin Firoozbakht"}]
dependencies = ["torch>=2.2,<3", "numpy>=1.26", "PyYAML>=6.0", "matplotlib>=3.8", "Pillow>=10"]

[project.optional-dependencies]
data = ["torchvision>=0.17,<1"]
demo = ["gradio>=4,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1"]

[project.scripts]
edgeformer = "edgeformer.cli:main"

[project.urls]
Repository = "https://github.com/matinfirooz/EdgeFormer-Studio"

[tool.setuptools.packages.find]
include = ["edgeformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"demo/app.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
